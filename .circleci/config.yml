version: 2.1

parameters:
  force_full:
    type: boolean
    default: false
jobs:
  verify:
    docker:
      - image: cimg/ruby:3.2.1
    resource_class: small
    environment:
      RAILS_ENV: test
      BUNDLE_FROZEN: "true"
    steps:
      - checkout
      - run:
          name: Check whether full verification is needed
          environment:
            CI_DEFAULT_BRANCH: "main"
            CI_BASE_REVISION: << pipeline.git.base_revision >>
            CI_FORCE_FULL: << pipeline.parameters.force_full >>
          command: bash .circleci/should-run.sh
      - run: bundle install
      - run: bundle exec rails db:prepare
      - run: bundle exec rails zeitwerk:check
      - run: bundle exec rails test
workflows:
  verify:
    when:
      or:
        - << pipeline.parameters.force_full >>
        - not:
            equal: ["main", << pipeline.git.branch >>]
    jobs:
      - verify
